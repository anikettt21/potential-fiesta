<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | FolioTub — Premium Resume Templates Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
      background: radial-gradient(ellipse at center top, var(--accent-soft) 0%, var(--bg) 75%);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border-h);
      border-radius: var(--radius-md);
      padding: 48px;
      box-shadow: 0 20px 60px -10px rgba(14, 53, 58, 0.15), 0 0 1px rgba(14, 53, 58, 0.1);
      position: relative;
      overflow: hidden;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin: 0 auto 20px;
    }

    .auth-title {
      font-family: var(--dfont);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .auth-sub {
      color: var(--text-m);
      font-size: 0.95rem;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-s);
      padding-left: 4px;
    }

    .form-input {
      width: 100%;
      height: 52px;
      padding: 0 20px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: all var(--transition);
    }

    .form-input:focus {
      background: #ffffff;
      border-color: var(--text);
      box-shadow: 0 0 0 4px rgba(14, 53, 58, 0.08);
    }

    .auth-submit-btn {
      margin-top: 12px;
      height: 56px;
      border-radius: 56px;
      background: var(--text);
      color: #ffffff;
      font-family: var(--dfont);
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(14, 53, 58, 0.2);
    }

    .auth-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-m);
    }

    .auth-footer a {
      color: var(--text);
      font-weight: 700;
      margin-left: 4px;
    }

    .error-msg {
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: 8px;
      color: #b91c1c;
      font-size: 0.88rem;
      display: none;
    }

    /* Floating shapes */
    .auth-shape {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--accent-soft);
      filter: blur(80px);
      z-index: -1;
      opacity: 0.5;
    }

    .auth-shape-1 {
      top: -100px;
      left: -100px;
    }

    .auth-shape-2 {
      bottom: -100px;
      right: -100px;
    }
  </style>
</head>

<body>
  <header class="mp-header">
    <div class="mp-header-inner">
      <a href="index.html" class="mp-brand">
        <div class="mp-brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>
        </div>
        <span class="mp-brand-name">FolioTub</span>
      </a>
      <a href="signup.html" class="mp-nav-link">Create Account</a>
    </div>
  </header>

  <main class="auth-section">
    <div class="auth-card">
      <div class="auth-shape auth-shape-1"></div>
      <div class="auth-shape auth-shape-2"></div>
      
      <div class="auth-header">
        <div class="auth-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-sub">Log in to access your saved resumes & premium templates</p>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <form class="auth-form" id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="auth-submit-btn" id="submit-btn">
          <span>Log In</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign Up Free</a>
      </div>
    </div>
  </main>

  <script src="auth_client.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Logging in...';
      errorMsg.style.display = 'none';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          errorMsg.innerText = data.message || 'Login failed. Please check your credentials.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.innerText = 'Connection error. Please check your internet.';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Log In</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>';
      }
    });
  </script>
</body>

</html>
